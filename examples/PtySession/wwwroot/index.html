<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>pty-session - Session Manager Demo</title>
    <link rel="shortcut icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABpfZFQAAAAABJRU5ErkJggg==" />
    <link href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css" type="text/css" rel="stylesheet" />
    <style type="text/css">
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; border: 0;
            background-color: #1e1e1e; color: #d4d4d4;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100%;
            overflow: hidden;
        }
        #app { display: flex; height: 100vh; }

        /* sidebar */
        #sidebar {
            width: 280px; min-width: 280px;
            background: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex; flex-direction: column;
        }
        #sidebar-header {
            padding: 12px;
            border-bottom: 1px solid #3c3c3c;
            display: flex; align-items: center; justify-content: space-between;
        }
        #sidebar-header h1 { font-size: 14px; margin: 0; font-weight: 600; }
        #btn-create {
            background: #0e639c; color: #fff; border: none;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        #btn-create:hover { background: #1177bb; }
        #btn-create:active { background: #0e639c; }
        #btn-create:disabled { background: #3a3d41; color: #6e6e6e; cursor: default; }

        #session-list { flex: 1; overflow-y: auto; padding: 8px; }
        .empty {
            color: #8a8a8a; font-size: 13px; text-align: center;
            padding: 32px 12px; line-height: 1.8;
        }
        .session-card {
            background: #2d2d30; border: 1px solid #3c3c3c;
            border-radius: 6px; padding: 10px; margin-bottom: 8px;
            cursor: pointer;
        }
        .session-card:hover { border-color: #0e639c; }
        .session-card.active { border-color: #1177bb; background: #1f3a4d; }
        .session-card .row1 {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 6px;
        }
        .session-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-id { font-size: 11px; color: #8a8a8a; margin-top: 2px; }
        .badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
        }
        .badge.running { background: #0f6e32; color: #b8e6c1; }
        .badge.exited { background: #5a3d00; color: #e6c9a0; }
        .session-actions { display: flex; gap: 6px; margin-top: 8px; }
        .session-actions button {
            flex: 1; font-size: 12px; padding: 4px 0; border-radius: 4px;
            border: 1px solid #3c3c3c; background: #3a3d41; color: #d4d4d4; cursor: pointer;
        }
        .session-actions button:hover { background: #45484d; }
        .session-actions button:active { background: #3a3d41; }
        .session-actions button.danger:hover { background: #6b2b2b; border-color: #8a3a3a; }

        /* terminal area */
        #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #status-bar {
            height: 30px; line-height: 30px; padding: 0 12px;
            background: #333333; color: #cccccc;
            font-family: Consolas, monospace; font-size: 12px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; justify-content: space-between;
        }
        #status-left { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #btn-detach {
            background: none; border: 1px solid #555; color: #ccc;
            border-radius: 4px; font-size: 12px; padding: 2px 10px; cursor: pointer;
        }
        #btn-detach:hover { background: #45484d; }
        #terminal-container { flex: 1; min-height: 0; }
        #placeholder {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #8a8a8a; font-size: 14px; text-align: center; line-height: 2;
        }

        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #sidebar { width: 100%; min-width: 0; max-height: 40vh; border-right: none; border-bottom: 1px solid #3c3c3c; }
        }
            #search-bar {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
        }
        #search-input {
            width: 160px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            padding: 2px 6px;
        }
        #search-bar button {
            border: 1px solid #555;
            background: #333;
            color: #fff;
            cursor: pointer;
        }</style>
</head>
<body>
    <!-- search bar -->
    <div id="search-bar">
        <input id="search-input" type="text" placeholder="Search" spellcheck="false" />
        <button id="search-prev" title="Previous">&#9650;</button>
        <button id="search-next" title="Next">&#9660;</button>
    </div>
    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-header">
                <h1>PTY Sessions</h1>
                <button id="btn-create">+ 创建会话</button>
            </div>
            <div id="session-list"></div>
        </aside>
        <main id="main">
            <div id="status-bar">
                <span id="status-left">connecting ...</span>
                <button id="btn-detach" style="display:none">脱离 (保留会话)</button>
            </div>
            <div id="terminal-container" style="display:none"></div>
            <div id="placeholder">无会话<br />点击左侧「创建会话」启动一个新终端<br />关闭页面后会话仍会在服务端继续运行，可重新打开页面从列表恢复</div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.16.0/lib/addon-search.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        (function () {
            var statusEl = document.getElementById('status-left');
            var placeholderEl = document.getElementById('placeholder');
            var termContainer = document.getElementById('terminal-container');
            var listEl = document.getElementById('session-list');
            var btnCreate = document.getElementById('btn-create');
            var btnDetach = document.getElementById('btn-detach');

            function setStatus(text) { statusEl.textContent = text; }

            var term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'underline',
                rendererType: 'canvas',
                theme: { background: '#1e1e1e', foreground: '#d4d4d4' }
            });
            var fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            // 搜索插件
            var searchAddon = new SearchAddon.SearchAddon();
            term.loadAddon(searchAddon);

            // WebGL 渲染加速插件（环境不支持时自动回退 canvas）
            try {
                var webglAddon = new WebglAddon.WebglAddon();
                webglAddon.onContextLoss(function (e) {
                    webglAddon.dispose();
                });
                term.loadAddon(webglAddon);
            } catch (e) {
                console.warn('WebGL renderer unavailable, falling back to canvas.', e);
            }

            // 搜索功能（Ctrl+F 聚焦搜索框，Enter/按钮查找）
            var searchInput = document.getElementById('search-input');
            function doSearch(forward) {
                var query = searchInput.value;
                if (!query) {
                    return;
                }
                if (forward) {
                    searchAddon.findNext(query);
                } else {
                    searchAddon.findPrevious(query);
                }
            }
            searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doSearch(true);
                }
            });
            document.getElementById('search-next').addEventListener('click', function () {
                doSearch(true);
            });
            document.getElementById('search-prev').addEventListener('click', function () {
                doSearch(false);
            });

            // 控制键盘按键是否被xterm捕获
            term.attachCustomKeyEventHandler(function (event) {
                // Ctrl+F 聚焦搜索框（浏览器查找功能被 xterm 占用，这里用插件替代）
                if (event.ctrlKey && event.key === 'f') {
                    event.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                    return false;
                }
                return true;
            });

            var socket = null;
            var currentId = null;   // attached session id
            var list = [];          // last known session list
            var reconnectTimer = null;
            var termInitialized = false;

            function initTerminal() {
                if (termInitialized) return;
                termInitialized = true;
                termContainer.style.display = 'block';
                placeholderEl.style.display = 'none';
                term.open(termContainer, true);
                fitAddon.fit();
            }

            function showPlaceholder() {
                termContainer.style.display = 'none';
                placeholderEl.style.display = 'flex';
                btnDetach.style.display = 'none';
            }

            function connect() {
                var schema = (/^https/ig).test(document.location.protocol) ? 'wss' : 'ws';
                socket = new WebSocket(schema + '://' + document.location.host + '/terminal');

                socket.onopen = function () {
                    setStatus('connected');
                    requestList();
                };

                socket.onclose = function () {
                    setStatus('disconnected - 重连中...');
                    socket = null;
                    if (reconnectTimer === null) {
                        reconnectTimer = setInterval(function () {
                            if (!socket || socket.readyState === WebSocket.CLOSED) {
                                connect();
                                clearInterval(reconnectTimer);
                                reconnectTimer = null;
                            }
                        }, 3000);
                    }
                };

                socket.onmessage = function (ev) {
                    if (typeof ev.data === 'string') {
                        handleMessage(JSON.parse(ev.data));
                    } else {
                        // binary: pty output (live or replay)
                        ev.data.arrayBuffer().then(function (buf) {
                            term.write(new Uint8Array(buf));
                        });
                    }
                };
            }

            function sendCommand(cmd) {
                if (!socket || socket.readyState !== WebSocket.OPEN) return;
                var bytes = new TextEncoder().encode(JSON.stringify(cmd));
                socket.send(bytes);
            }

            function handleMessage(msg) {
                switch (msg.type) {
                    case 'list':
                        list = msg.data || [];
                        renderList();
                        break;
                    case 'created':
                        attachTo(msg.data.id);
                        break;
                    case 'attached':
                        currentId = msg.data.id;
                        setStatus('已连接会话: ' + msg.data.name + (msg.data.running ? ' (运行中)' : ' (已退出)'));
                        btnDetach.style.display = '';
                        // replay follows as binary frames; give xterm a clean screen first
                        term.reset();
                        term.clear();
                        requestList();
                        break;
                    case 'destroyed':
                        if (currentId === msg.data.id) {
                            currentId = null;
                            term.clear();
                            showPlaceholder();
                            setStatus('会话已销毁');
                        }
                        requestList();
                        break;
                    case 'detached':
                        currentId = null;
                        term.clear();
                        showPlaceholder();
                        setStatus('已脱离，会话保留在服务端');
                        requestList();
                        break;
                    case 'session-ended':
                        setStatus('会话 ' + msg.data.id + ' 已退出 (exit code ' + msg.data.exitCode + ')');
                        requestList();
                        break;
                    case 'error':
                        setStatus('错误: ' + msg.data);
                        break;
                }
            }

            function requestList() {
                sendCommand({ action: 'list' });
            }

            function renderList() {
                if (!list.length) {
                    listEl.innerHTML = '<div class="empty">暂无会话<br />点击「创建会话」启动终端<br /><br />关闭页面后会话会继续运行，<br />回来从这里恢复</div>';
                    return;
                }
                listEl.innerHTML = '';
                list.forEach(function (s) {
                    var card = document.createElement('div');
                    card.className = 'session-card' + (s.id === currentId ? ' active' : '');

                    var row1 = document.createElement('div');
                    row1.className = 'row1';
                    var name = document.createElement('span');
                    name.className = 'session-name';
                    name.textContent = s.name;
                    var badge = document.createElement('span');
                    badge.className = 'badge ' + (s.running ? 'running' : 'exited');
                    badge.textContent = s.running ? '运行中' : '已退出';
                    row1.appendChild(name);
                    row1.appendChild(badge);

                    var idLine = document.createElement('div');
                    idLine.className = 'session-id';
                    idLine.textContent = s.id + ' · ' + new Date(s.created).toLocaleTimeString();

                    var actions = document.createElement('div');
                    actions.className = 'session-actions';
                    var btnAttach = document.createElement('button');
                    btnAttach.textContent = '恢复';
                    btnAttach.onclick = function (e) {
                        e.stopPropagation();
                        attachTo(s.id);
                    };
                    var btnDestroy = document.createElement('button');
                    btnDestroy.className = 'danger';
                    btnDestroy.textContent = '销毁';
                    btnDestroy.onclick = function (e) {
                        e.stopPropagation();
                        if (confirm('确定销毁会话 ' + s.id + '？')) {
                            sendCommand({ action: 'destroy', data: { id: s.id } });
                        }
                    };
                    actions.appendChild(btnAttach);
                    actions.appendChild(btnDestroy);

                    card.appendChild(row1);
                    card.appendChild(idLine);
                    card.appendChild(actions);
                    card.onclick = function () { attachTo(s.id); };
                    listEl.appendChild(card);
                });
            }

            function attachTo(id) {
                if (!socket || socket.readyState !== WebSocket.OPEN) return;
                initTerminal();
                setStatus('attaching ' + id + ' ...');
                sendCommand({ action: 'attach', data: { id: id } });
            }

            btnCreate.onclick = function () {
                if (!socket || socket.readyState !== WebSocket.OPEN) return;
                initTerminal();
                setStatus('创建会话 ...');
                sendCommand({ action: 'create', data: { cols: term.cols || 80, rows: term.rows || 30 } });
            };

            btnDetach.onclick = function () {
                sendCommand({ action: 'detach' });
            };

            // input & resize only while attached
            term.onData(function (data) {
                if (socket && socket.readyState === WebSocket.OPEN && currentId) {
                    socket.send(data);
                }
            });
            term.onResize(function (size) {
                if (socket && socket.readyState === WebSocket.OPEN && currentId) {
                    sendCommand({ action: 'resize', data: { cols: size.cols, rows: size.rows } });
                }
            });
            window.addEventListener('resize', function () {
                if (termInitialized) fitAddon.fit();
            });

            connect();
        })();
    </script>
</body>
</html>
