<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="author" content="gsw945" />
    <title>PtyWeb.SignalR - Demo</title>
    <link rel="shortcut icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABpfZFQAAAAABJRU5ErkJggg==" />
    <link href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css" type="text/css" rel="stylesheet" />
    <style type="text/css">
        html,
        body {
            margin: 0;
            padding: 0;
            border: 0;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        #terminal-container {
            height: calc(100vh - 24px);
            width: 100vw;
        }
        #status-bar {
            height: 24px;
            line-height: 24px;
            padding: 0 8px;
            background-color: #333333;
            color: #cccccc;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
            #search-bar {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
        }
        #search-input {
            width: 160px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            padding: 2px 6px;
        }
        #search-bar button {
            border: 1px solid #555;
            background: #333;
            color: #fff;
            cursor: pointer;
        }</style>
</head>
<body>
    <!-- search bar -->
    <div id="search-bar">
        <input id="search-input" type="text" placeholder="Search" spellcheck="false" />
        <button id="search-prev" title="Previous">&#9650;</button>
        <button id="search-next" title="Next">&#9660;</button>
    </div>
    <div id="terminal-container"></div>
    <div id="status-bar">connecting ...</div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.16.0/lib/addon-search.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        (function () {
            var statusBar = document.getElementById('status-bar');

            function setStatus(text) {
                statusBar.textContent = text;
                console.log('[status]:', text);
            }

            var term = new Terminal({
                cols: 80,
                rows: 30,
                cursorBlink: true,
                cursorStyle: 'underline',
                rendererType: 'canvas',
                theme: {
                    background: '#1e1e1e',
                    foreground: '#d4d4d4'
                }
            });

            var fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            // 搜索插件
            var searchAddon = new SearchAddon.SearchAddon();
            term.loadAddon(searchAddon);

            // WebGL 渲染加速插件（环境不支持时自动回退 canvas）
            try {
                var webglAddon = new WebglAddon.WebglAddon();
                webglAddon.onContextLoss(function (e) {
                    webglAddon.dispose();
                });
                term.loadAddon(webglAddon);
            } catch (e) {
                console.warn('WebGL renderer unavailable, falling back to canvas.', e);
            }

            // 搜索功能（Ctrl+F 聚焦搜索框，Enter/按钮查找）
            var searchInput = document.getElementById('search-input');
            function doSearch(forward) {
                var query = searchInput.value;
                if (!query) {
                    return;
                }
                if (forward) {
                    searchAddon.findNext(query);
                } else {
                    searchAddon.findPrevious(query);
                }
            }
            searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doSearch(true);
                }
            });
            document.getElementById('search-next').addEventListener('click', function () {
                doSearch(true);
            });
            document.getElementById('search-prev').addEventListener('click', function () {
                doSearch(false);
            });

            // 控制键盘按键是否被xterm捕获
            term.attachCustomKeyEventHandler(function (event) {
                // Ctrl+F 聚焦搜索框（浏览器查找功能被 xterm 占用，这里用插件替代）
                if (event.ctrlKey && event.key === 'f') {
                    event.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                    return false;
                }
                return true;
            });

            term.open(document.getElementById('terminal-container'), true);
            term.focus();
            fitAddon.fit();

            // base64 (JSON protocol) -> Uint8Array, fed to xterm
            function base64ToBytes(base64) {
                var binary = atob(base64);
                var bytes = new Uint8Array(binary.length);
                for (var i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes;
            }

            var connection = new signalR.HubConnectionBuilder()
                .withUrl('/terminalHub')
                .configureLogging(signalR.LogLevel.Warning)
                .build();

            connection.on('Output', function (data) {
                term.write(base64ToBytes(data));
            });

            connection.on('Closed', function (exitCode) {
                setStatus('pty session closed, exit code: ' + exitCode);
                term.write('\r\n\x1b[31m[pty closed]\x1b[0m\r\n');
            });

            connection.onclose(function (err) {
                setStatus(err ? ('connection closed: ' + err.message) : 'connection closed');
            });

            // 尺寸变化即时上报（连接建立后生效；未连接时跳过，连接后由下方
            // 的 fit/轮询兜底补报），与 EmbedIO 版示例的持续上报机制对齐。
            term.onResize(function (size) {
                if (connection.state === signalR.HubConnectionState.Connected) {
                    connection.invoke('Resize', size.cols, size.rows);
                    setStatus('connected (' + size.cols + 'x' + size.rows + ')');
                }
            });

            // 节流轮询兜底：即使某些时机下 onResize 未触发（例如初始 fit 过早），
            // 定期比对 term 实际尺寸并补报，确保初始大小最终正确。
            var latestNotifySize = [term.cols, term.rows];
            setInterval(function () {
                if (connection.state === signalR.HubConnectionState.Connected &&
                    (latestNotifySize[0] !== term.cols || latestNotifySize[1] !== term.rows)) {
                    latestNotifySize = [term.cols, term.rows];
                    connection.invoke('Resize', term.cols, term.rows);
                }
            }, 333);

            // 页面完全加载后布局已稳定，重新 fit 并补报一次正确的初始尺寸。
            setTimeout(function () {
                fitAddon.fit();
                if (connection.state === signalR.HubConnectionState.Connected) {
                    connection.invoke('Resize', term.cols, term.rows);
                }
            }, 300);

            connection.start().then(function () {
                // 连接建立后容器布局已稳定，重新 fit 确保初始尺寸正确上报
                fitAddon.fit();
                setStatus('connected (' + term.cols + 'x' + term.rows + ')');

                // Wire input + resize only after the connection is up.
                term.onData(function (data) {
                    connection.invoke('Input', data);
                });


                connection.invoke('Resize', term.cols, term.rows);
            }).catch(function (err) {
                setStatus('connect failed: ' + err.message);
                console.error(err);
            });

            window.addEventListener('resize', function () {
                fitAddon.fit();
            });
        })();
    </script>
</body>
</html>
